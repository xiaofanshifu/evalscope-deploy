services:
  evalscope:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        EVALSCOPE_VERSION: "v1.10.0"
    image: "evalscope:v1.10.0"
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
    ports:
      - "9000:9000"
    volumes:
      - ./outputs:/workspace/outputs
      - evalscope_cache:/root/.cache
    stdin_open: true
    tty: true

volumes:
  evalscope_cache:

