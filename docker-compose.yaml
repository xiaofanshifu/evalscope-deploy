services:
  evalscope:
    build:
      context: .
      dockerfile: Dockerfile
      # 默认部署值；实际版本/ref/tag 由 deploy.sh 写入 docker-compose.override.yaml
      # （compose 自动合并），本文件不被脚本修改
      args:
        INSTALL_METHOD: "pip"
        EVALSCOPE_VERSION: "1.12.0"
        EVALSCOPE_REF: "main"
        # 唯一组件配置点，不通过 deploy.sh 参数修改（needle_haystack 仅含 matplotlib+seaborn）
        EVALSCOPE_PACKAGES: "perf,service,ifeval,ifbench,openai_mrcr,needle_haystack"
        # 仅构建期代理：Docker 特殊 build args，容器运行时直连；会记录在镜像层历史
        HTTP_PROXY: "${EVALSCOPE_BUILD_PROXY:-}"
        HTTPS_PROXY: "${EVALSCOPE_BUILD_PROXY:-}"
        NO_PROXY: "${EVALSCOPE_NO_PROXY:-localhost,127.0.0.1}"
    image: "evalscope:1.12.0"
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
    ports:
      # 宿主机端口可配置：.env 中设置 EVALSCOPE_HOST_PORT（默认 80），容器内固定监听 80
      - "${EVALSCOPE_HOST_PORT:-80}:80"
    volumes:
      - ./outputs:/workspace/outputs
      - evalscope_cache:/root/.cache
    stdin_open: true
    tty: true

volumes:
  evalscope_cache:
